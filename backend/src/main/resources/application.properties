spring.application.name=portiq

# H2 in-memory database (development)
spring.datasource.url=jdbc:h2:mem:portiqdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security - override these via environment variables in real deployments
app.jwt.secret=${JWT_SECRET:}
app.encryption.key=${DB_ENCRYPTION_KEY:}
app.owner.username=${OWNER_USERNAME:owner}
app.owner.password=${OWNER_PASSWORD:ChangeMe123!}
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.rp-name=${WEBAUTHN_RP_NAME:Portiq}
app.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:5173}

# Insights (portfolio summary / statement scanning) - optional, feature disabled until set
app.insights.api-key=${INSIGHTS_API_KEY:}
app.insights.api-url=${INSIGHTS_API_URL:}
app.insights.model=${INSIGHTS_MODEL:llama-3.3-70b-versatile}
app.insights.vision-model=${INSIGHTS_VISION_MODEL:qwen/qwen3.6-27b}

# Analytics (risk scoring + recommendations) - no API key needed, computed from Yahoo Finance history.
# The benchmark is what beta is measured against; ^NSEI is the NIFTY 50, matching the .NS tickers.
app.analytics.benchmark-ticker=${ANALYTICS_BENCHMARK:^NSEI}
app.analytics.risk-free-rate=${ANALYTICS_RISK_FREE_RATE:6.5}
app.recommendations.universe=${RECOMMENDATION_UNIVERSE:RELIANCE.NS,TCS.NS,HDFCBANK.NS,INFY.NS,ICICIBANK.NS,HINDUNILVR.NS,ITC.NS,SBIN.NS,BHARTIARTL.NS,BAJFINANCE.NS,KOTAKBANK.NS,LT.NS,AXISBANK.NS,ASIANPAINT.NS,MARUTI.NS,SUNPHARMA.NS,TITAN.NS,ULTRACEMCO.NS,WIPRO.NS,NESTLEIND.NS}
app.recommendations.max-ideas=${RECOMMENDATION_MAX_IDEAS:5}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# App info
info.app.name=Portiq
info.app.description=Portfolio Management System
info.app.version=1.0.0

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
server.port=4001