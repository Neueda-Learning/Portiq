spring.application.name=portiq

# H2 in-memory database (development)
spring.datasource.url=jdbc:h2:mem:portiqdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# Set explicitly rather than left to Boot's default-on-with-a-warning. Open Session in View keeps
# a database connection held open for the whole request while the view renders, which on a JSON
# API buys nothing and quietly caps throughput at the connection pool size. Off means a lazy
# association touched after the service returns fails loudly in a test instead of silently
# issuing an extra query per row in production.
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security - override these via environment variables in real deployments.
# StartupSecurityValidator warns about the development defaults here and refuses to start
# the prod profile until they are replaced.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:12}
app.encryption.key=${DB_ENCRYPTION_KEY:}
app.owner.username=${OWNER_USERNAME:owner}
app.owner.password=${OWNER_PASSWORD:ChangeMe123!}
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.rp-name=${WEBAUTHN_RP_NAME:Portiq}
app.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:5173}

# Browser origins allowed to call this API. Explicit list only - '*' is rejected at startup,
# because these responses carry portfolio data.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5500,https://portiq-amber.vercel.app}

# Hosts this server may make outbound requests to. Everything else is refused before the
# connection is opened, so a hostile ticker cannot steer a fetch somewhere internal.
app.security.outbound.allowed-hosts=${OUTBOUND_ALLOWED_HOSTS:query1.finance.yahoo.com,query2.finance.yahoo.com,feeds.finance.yahoo.com,news.google.com}

# Rate limiting and failed-login lockout
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.login.max-failures-per-account=${LOGIN_MAX_FAILURES:5}
app.security.login.max-failures-per-address=${LOGIN_MAX_FAILURES_PER_IP:20}
app.security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# Only enable behind a proxy that overwrites X-Forwarded-For. Trusting the header on a directly
# exposed server lets a caller forge a new identity per request and slip every per-IP limit.
app.security.trust-proxy=${TRUST_PROXY:false}

# Whether Swagger UI and the OpenAPI document are readable without logging in
app.security.docs.public=${DOCS_PUBLIC:true}

app.security.upload.max-bytes=${UPLOAD_MAX_BYTES:10485760}
app.security.audit.log-client-ip=${AUDIT_LOG_CLIENT_IP:true}

# Outbound HTTP timeouts - without these a hung upstream holds a request thread indefinitely
app.http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:5000}
app.http.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:20000}

# Insights (portfolio summary / statement scanning) - optional, feature disabled until set
app.insights.api-key=${INSIGHTS_API_KEY:}
# Defaulted rather than left blank. It used to be empty here while docker-compose.prod.yml
# supplied a default of its own, so the AI features worked when deployed and silently reported
# "not configured" on a local run even after INSIGHTS_API_KEY was set - because isConfigured()
# needs both halves. Setting the key alone is now enough anywhere.
app.insights.api-url=${INSIGHTS_API_URL:https://api.groq.com/openai/v1/chat/completions}
app.insights.model=${INSIGHTS_MODEL:llama-3.3-70b-versatile}
app.insights.vision-model=${INSIGHTS_VISION_MODEL:qwen/qwen3.6-27b}

# Analytics (risk scoring + recommendations) - no API key needed, computed from Yahoo Finance history.
# The benchmark is what beta is measured against; ^NSEI is the NIFTY 50, matching the .NS tickers.
app.analytics.benchmark-ticker=${ANALYTICS_BENCHMARK:^NSEI}
app.analytics.risk-free-rate=${ANALYTICS_RISK_FREE_RATE:6.5}
app.recommendations.universe=${RECOMMENDATION_UNIVERSE:RELIANCE.NS,TCS.NS,HDFCBANK.NS,INFY.NS,ICICIBANK.NS,HINDUNILVR.NS,ITC.NS,SBIN.NS,BHARTIARTL.NS,BAJFINANCE.NS,KOTAKBANK.NS,LT.NS,AXISBANK.NS,ASIANPAINT.NS,MARUTI.NS,SUNPHARMA.NS,TITAN.NS,ULTRACEMCO.NS,WIPRO.NS,NESTLEIND.NS}
app.recommendations.max-ideas=${RECOMMENDATION_MAX_IDEAS:5}

# Error responses - never return a stack trace or an internal exception message to a caller.
# GlobalExceptionHandler already does this for handled paths; these cover what Spring itself
# renders, such as a 404 for an unmapped URL.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Send no Server header. It is free reconnaissance: it names the container and version, which is
# all a scanner needs to look up which CVEs to try.
server.server-header=

# Bound the request surface. Defaults are generous enough that a single crafted request can tie up
# memory parsing headers or form fields it will never legitimately need.
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=10MB

# Logging - see logback-spring.xml for the appenders. Point app.logging.dir at a mounted volume
# in a container, or logs vanish with the container that wrote them.
app.logging.dir=${LOG_DIR:logs}
logging.level.SECURITY=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# App info
info.app.name=Portiq
info.app.description=Portfolio Management System
info.app.version=1.0.0

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
server.port=4001