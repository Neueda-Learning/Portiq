# Supabase (managed Postgres) — activate with: -Dspring.profiles.active=supabase
# Requires environment variables: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, JWT_SECRET, DB_ENCRYPTION_KEY
#
# Defaults below match Supabase's "Transaction pooler" connection details (port 6543, pgbouncer
# in transaction mode). prepareThreshold=0 disables JDBC server-side prepared statements, which
# transaction pooling does not support (each statement can land on a different backend
# connection). If you switch to the Session pooler (port 5432) or a Direct connection instead,
# that parameter is harmless to leave in place.

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:6543}/${DB_NAME:postgres}?prepareThreshold=0
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator — restrict in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET:}
app.encryption.key=${DB_ENCRYPTION_KEY:}
app.owner.username=${OWNER_USERNAME:owner}
app.owner.password=${OWNER_PASSWORD:ChangeMe123!}
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.rp-name=${WEBAUTHN_RP_NAME:Portiq}
app.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:5173}
app.insights.api-key=${INSIGHTS_API_KEY:}
app.insights.api-url=${INSIGHTS_API_URL:}
app.insights.model=${INSIGHTS_MODEL:llama-3.3-70b-versatile}
app.insights.vision-model=${INSIGHTS_VISION_MODEL:qwen/qwen3.6-27b}
