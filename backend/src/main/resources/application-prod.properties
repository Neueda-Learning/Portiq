# Production configuration — activate with: -Dspring.profiles.active=prod
# Requires environment variables: DB_HOST, DB_NAME, DB_USERNAME, DB_PASSWORD, JWT_SECRET, DB_ENCRYPTION_KEY

# TLS to the database now defaults on. useSSL=false sent credentials and every decrypted portfolio
# row across the network in the clear, and allowPublicKeyRetrieval let a man-in-the-middle hand the
# driver its own key during password exchange.
#
# DB_SSL_MODE=DISABLED turns it off for a database that has no certificate configured yet - but
# that is a temporary state, not a setting to leave alone.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:portiq_db}?sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator — restrict in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET:}
app.encryption.key=${DB_ENCRYPTION_KEY:}
app.owner.username=${OWNER_USERNAME:owner}
app.owner.password=${OWNER_PASSWORD:ChangeMe123!}
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.rp-name=${WEBAUTHN_RP_NAME:Portiq}
app.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:5173}
app.insights.api-key=${INSIGHTS_API_KEY:}
app.insights.api-url=${INSIGHTS_API_URL:}
app.insights.model=${INSIGHTS_MODEL:llama-3.3-70b-versatile}
app.insights.vision-model=${INSIGHTS_VISION_MODEL:qwen/qwen3.6-27b}

# --- Production security posture -------------------------------------------------------------
# The API documentation describes every endpoint and its payloads. Useful in development, free
# reconnaissance in production, so it needs a session here.
app.security.docs.public=${DOCS_PUBLIC:false}

# Production runs behind a reverse proxy, so X-Forwarded-For is the real client address and
# Tomcat is told to honour the forwarded protocol - without which HSTS is never sent, because
# every request looks like plain http to the application.
app.security.trust-proxy=${TRUST_PROXY:true}
server.forward-headers-strategy=framework

# Refuse to start on any of the development defaults. See StartupSecurityValidator.
app.security.enforce-secrets=${ENFORCE_SECRETS:true}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.server-header=
