services:
  mysql:
    image: mysql:8.4
    container_name: portiq-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-portiq_db}
      MYSQL_USER: ${DB_USERNAME:-portiq}
      MYSQL_PASSWORD: ${DB_PASSWORD:-portiq}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-portiq_root}
    ports:
      - "3306:3306"
    volumes:
      - portiq_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-portiq_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portiq_mysql_data:
