# Continuous integration only. Deployment is Jenkins' job - see Jenkinsfile.
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # The dependency scan also runs weekly. A CVE is published against a dependency we already
  # have, not against a change we just made, so a scan that only runs on push would report a
  # vulnerability whenever someone next happened to touch the backend - which could be weeks.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

      # if: always() so the reports survive a failing run - which is the only time anyone
      # goes looking for them. Without this the evidence disappears with the runner.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portiq-backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Package
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: portiq-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  dependency-scan:
    name: Dependency CVE scan
    runs-on: ubuntu-latest
    # Runs alongside the tests rather than after them. It is the slowest job here and does not
    # depend on the build, so gating it behind the test job would add several minutes to the
    # feedback loop for no benefit.
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The NVD database is the expensive part - minutes on a cold cache, seconds warm. Keyed by
      # week so it refreshes regularly without a full re-download on every run.
      - name: Cache the NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      # Fails the build on any dependency scoring CVSS 7.0 or above - the threshold is set in
      # the pom's `security` profile, so it stays identical to a local `mvn -Psecurity verify`.
      #
      # NVD_API_KEY is optional but strongly recommended: without it NVD rate-limits anonymous
      # callers hard enough that the initial sync can take upwards of half an hour. Get one free
      # at https://nvd.nist.gov/developers/request-an-api-key and add it as a repository secret.
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Psecurity verify -DskipTests

      # if: always() so the report is published when the scan FAILS, which is the only time
      # anyone needs to read it - it names which dependency and which CVE.
      - name: Upload the vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portiq-dependency-check-report
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
          retention-days: 30
          if-no-files-found: ignore

  docker:
    name: Verify image builds
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Jenkins builds this same image to deploy. Building it here too means a
      # broken Dockerfile fails the PR rather than the deploy.
      - name: Build backend image
        run: docker build -t portiq-backend:ci ./backend
