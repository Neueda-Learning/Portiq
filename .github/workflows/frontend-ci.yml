# Continuous integration only. Deployment is Jenkins' job - see Jenkinsfile.
name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs before the build so a failing test stops the pipeline at the cheapest point.
      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      # if: always() so the report is still published when a test failed - which is exactly
      # when someone needs to read it.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portiq-frontend-test-report
          path: logs/frontend-tests.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portiq-frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Verify image builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Jenkins builds this same image to deploy. Building it here too means a
      # broken Dockerfile or nginx config fails the PR rather than the deploy.
      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL= -t portiq-frontend:ci ./frontend

      - name: Check nginx config is valid
        run: docker run --rm portiq-frontend:ci nginx -t
