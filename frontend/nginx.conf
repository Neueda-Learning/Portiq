server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the backend at request time rather than at
    # startup matters twice over: nginx boots even when the backend is not up
    # yet, and it picks up the new address when that container is recreated. A
    # hostname in an "upstream" block is resolved once while the config loads and
    # then cached for the life of the process - which also means the config
    # cannot even be validated without the backend running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portiq_backend "http://backend:4001";

    # The statement-image import posts a file; the backend caps it at 10MB, so
    # allow a little headroom and let Spring produce the error rather than nginx.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container healthcheck target. Served by nginx so it stays up even when the
    # backend is down - a failing backend should not restart the web tier.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything the Spring app owns. Same origin as the SPA, so the browser
    # sends no preflight and no CORS configuration is involved.
    location ~ ^/(api|actuator|swagger-ui|api-docs|v3)(/|$) {
        # $request_uri is required here: once proxy_pass contains a variable,
        # nginx stops forwarding the original URI automatically. It carries the
        # query string too.
        proxy_pass $portiq_backend$request_uri;
        proxy_http_version 1.1;

        # Clear Origin before the backend sees it. The SPA and the API share an
        # origin here, but browsers attach an Origin header to every non-GET
        # request even when it is same-origin, and Spring's CORS filter answers
        # 403 "Invalid CORS request" for anything outside its hardcoded
        # allow-list - which cannot know the host this is deployed on. Clearing
        # it lets the backend see the same-origin request it actually is, and
        # keeps the image host-agnostic: localhost, a LAN address or a public IP
        # all work with no rebuild.
        #
        # This gives up nothing. The backend publishes no port, so every request
        # reaching it has already come through this proxy, and the API
        # authenticates with a Bearer token from localStorage rather than a
        # cookie - so a cross-origin page has no credential to replay, which is
        # the attack CORS would be defending against.
        proxy_set_header Origin           "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Summary and image import call an external model and can be slow.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location = /swagger-ui.html {
        proxy_pass $portiq_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Origin "";
        proxy_set_header Host   $host;
    }

    # Vite emits content-hashed filenames here, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app shell and the service worker must never be cached, or a browser
    # will keep serving the previous deploy indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths render the SPA, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
