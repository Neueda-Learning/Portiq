# Full application stack for deployment on a Linux host.
#
# docker-compose.yml (the other file) starts only MySQL, for running the backend
# from your IDE. This one runs everything in containers and is what Jenkins
# deploys. Only the frontend publishes a host port; MySQL and the backend are
# reachable only on the internal network.
#
#   cp .env.prod.example .env.prod
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

name: portiq

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-portiq_db}
      MYSQL_USER: ${DB_USERNAME:-portiq}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
    volumes:
      - portiq_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [portiq]

  backend:
    build:
      context: ./backend
    image: portiq-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-portiq_db}
      DB_USERNAME: ${DB_USERNAME:-portiq}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      # Rotating this makes existing encrypted rows unreadable - keep it stable.
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?OWNER_PASSWORD must be set}
      # WebAuthn is origin-bound: these must match the URL you open in the browser.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Portiq}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8090}
      # Optional - the summary and image import report "not configured" and the
      # rest of the app is unaffected when the key is absent. The model names
      # need real defaults rather than empty ones: an empty environment variable
      # still overrides the fallback in application.properties, so passing ""
      # would leave the model unset even once a key is supplied.
      INSIGHTS_API_KEY: ${INSIGHTS_API_KEY:-}
      INSIGHTS_API_URL: ${INSIGHTS_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      INSIGHTS_MODEL: ${INSIGHTS_MODEL:-llama-3.3-70b-versatile}
      INSIGHTS_VISION_MODEL: ${INSIGHTS_VISION_MODEL:-qwen/qwen3.6-27b}
      ANALYTICS_BENCHMARK: ${ANALYTICS_BENCHMARK:-^NSEI}
      ANALYTICS_RISK_FREE_RATE: ${ANALYTICS_RISK_FREE_RATE:-6.5}
      # Browsers allowed to call the API. The frontend is same-origin through nginx here,
      # so the default only needs to cover the address the app is opened at.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090}
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-query1.finance.yahoo.com,query2.finance.yahoo.com,feeds.finance.yahoo.com,news.google.com}
      # nginx sits in front, so X-Forwarded-For is the real client and can be trusted.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      DOCS_PUBLIC: ${DOCS_PUBLIC:-false}
      DB_SSL_MODE: ${DB_SSL_MODE:-REQUIRED}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-12}
    expose:
      - "4001"
    networks: [portiq]

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin - nginx in this image proxies /api to the backend.
        VITE_API_BASE_URL: ""
    image: portiq-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:80"
    networks: [portiq]

volumes:
  portiq_mysql_data:

networks:
  portiq:
    driver: bridge
